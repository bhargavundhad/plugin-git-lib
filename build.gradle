plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.11'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version '1.2.11'
    id 'java-library'
    id 'java-test-fixtures'
    id "idea"
    id 'jacoco'
    id 'signing'
    id 'net.researchgate.release' version '3.2.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_25

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Shared kernel library for Kestra Git plugins (OSS and EE).'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    compileOnly group: "io.kestra", name: "script", version: kestraVersion

    // git — exposed as api so consumers (plugin-git, plugin-ee-git) inherit them transitively
    // kept in lockstep with plugin-ee-git's jgit version to avoid silently downgrading it
    // MAINTENANCE: JGitCleanupIsolation reaches into the internal org.eclipse.jgit.internal.util.CleanupService
    // to suppress JGit's JVM shutdown hook (issue #23). That internal API has no compatibility contract, so on any
    // JGit bump re-run JGitShutdownRaceTest — it is the canary for both the mechanism (hook still suppressible)
    // and each failure mode (checkout index lock, fetch/partial-clone cleanup) — before releasing.
    api 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'
    api 'org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:7.8.0.202609011348-r'
    api "org.eclipse.jgit:org.eclipse.jgit.http.apache:7.8.0.202609011348-r"

    // kestra API client: exposed as api since consumers build KestraClient instances from the lib's classes.
    // Versioned separately from kestraVersion, it has its own release cadence and is absent from the platform BOM.
    api "io.kestra:kestra-api-client:$kestraApiClientVersion"
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testFixturesAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testFixturesImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'
    testFixturesAnnotationProcessor "org.projectlombok:lombok"
    testFixturesCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "script", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion

    // test fixtures — shared Gitea/Kestra-container test scaffolding consumed by plugin-git and plugin-ee-git
    testFixturesCompileOnly group: "io.kestra", name: "core", version: kestraVersion
    testFixturesCompileOnly group: "io.kestra", name: "tests", version: kestraVersion
    testFixturesCompileOnly "io.micronaut:micronaut-context"
    testFixturesImplementation "io.micronaut.test:micronaut-test-junit5"
    testFixturesImplementation "org.testcontainers:testcontainers:2.0.5"
    testFixturesImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testFixturesImplementation "org.junit.jupiter:junit-jupiter-api"

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
    testImplementation "ch.qos.logback:logback-classic"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
// Gradle publishes the testFixtures feature variant as extra "optional" runtime dependencies
// (micronaut-test-junit5, testcontainers, junit-jupiter-api) in the flattened Maven POM, since the legacy POM format
// has no concept of feature variants. Gradle consumers (e.g. plugin-ee-git's `testFixtures(...)`) never read these:
// they resolve the test-fixtures artifact and its dependencies through the published Gradle module metadata, which
// this does not touch. Stripping them from the POM only keeps non-Gradle/POM-scanning consumers from seeing
// test-only dependencies listed against the main artifact.
def testOnlyPomArtifacts = ['micronaut-test-junit5', 'testcontainers', 'testcontainers-junit-jupiter', 'junit-jupiter-api']
publishing {
    publications.withType(MavenPublication).configureEach {
        pom.withXml {
            def dependencies = asNode().dependencies
            if (dependencies) {
                dependencies.dependency.findAll { testOnlyPomArtifacts.contains(it.artifactId.text()) }
                    .each { dependencies[0].remove(it) }
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }

    // Dynamically set properties with default values
    failOnSnapshotDependencies = (project.hasProperty('release.failOnSnapshotDependencies')
        ? project.property('release.failOnSnapshotDependencies').toBoolean()
        : true)
    pushReleaseVersionBranch = (project.hasProperty('release.pushReleaseVersionBranch')
        ? project.property('release.pushReleaseVersionBranch').toString()
        : null)
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
